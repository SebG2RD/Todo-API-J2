# Modèle du Secret. Le vrai fichier, k8s/todo-secret.yaml, est exclu du dépôt.
#
# Le sujet demande de versionner les manifestes du cluster, Secret compris, et
# la grille exige dans le même temps qu'aucun secret ne soit versionné. Les deux
# se concilient de la seule façon qui tienne : la forme du Secret est dans le
# dépôt, ses valeurs n'y sont pas. C'est exactement le rapport qu'entretiennent
# .env.example et .env depuis le Jour 1.
#
# stringData plutôt que data : Kubernetes accepte du texte en clair et se charge
# lui-même de l'encoder en base64 à l'enregistrement. Cet encodage n'est pas un
# chiffrement, et c'est bien pour ça que le vrai fichier reste dehors : un
# base64 committé se relit en une commande.
#
# Créer le vrai Secret, sans passer par un fichier sur le disque :
#
#   kubectl create secret generic todo-secret -n todo \
#     --from-literal=DB_NAME=todo_prod \
#     --from-literal=DB_USER=todo_prod_user \
#     --from-literal=DB_PASSWORD='<le mot de passe>'
#
# Ou, à partir d'une copie locale de ce modèle une fois remplie :
#
#   cp k8s/todo-secret.example.yaml k8s/todo-secret.yaml
#   kubectl apply -f k8s/todo-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: todo-secret
  namespace: todo
type: Opaque
stringData:
  # DB_NAME sert deux fois : l'API s'y connecte, et le conteneur PostgreSQL
  # crée la base sous ce nom à sa toute première initialisation.
  DB_NAME: todo_prod
  DB_USER: todo_prod_user
  DB_PASSWORD: a_remplacer_par_un_vrai_mot_de_passe
