# Le Deployment décrit l'état voulu, pas les gestes pour y arriver.
#
# On ne dit jamais « lance un conteneur » : on dit « il doit exister N pods
# construits sur ce modèle ». La boucle de réconciliation du cluster compare en
# permanence cet état voulu à l'état réel, et corrige l'écart toute seule. Un pod
# supprimé à la main réapparaît en quelques secondes, sans qu'on ait rien retapé.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  namespace: todo
spec:
  # Trois copies, et non une. Une copie unique encaisse tout le trafic seule et
  # tombe avec lui. Le selector ci-dessous n'a pas eu à changer : c'est
  # l'étiquette qui relie le Service aux pods, pas leur nombre.
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable: 0 interdit qu'un ancien pod parte avant qu'un nouveau
      # soit prêt au sens de la readinessProbe. C'est ce réglage, et lui seul,
      # qui rend la mise à jour transparente pour les clients.
      maxUnavailable: 0
      # Le prix à payer : une copie de plus le temps de la transition, donc un
      # quart de ressources en trop pendant quelques secondes. Avec 3 replicas,
      # le cluster monte à 4 pods au pic.
      maxSurge: 1
  # Le selector relie ce Deployment aux pods qu'il possède. Il doit coller aux
  # labels du template ci-dessous, sinon le Deployment crée des pods qu'il ne
  # reconnaît pas et en recrée indéfiniment.
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      containers:
        - name: todo-api
          # Le tag est le sha d'un commit précis, jamais latest. Un tag mouvant
          # rendrait impossible de dire quelle version tourne, et le retour
          # arrière redeviendrait une enquête.
          image: nghtmre/todo-api:a4f7a329961d65450b5f00489fc186402600104d
          ports:
            - containerPort: 3000
          # envFrom déverse toutes les clés des deux objets dans l'environnement
          # du conteneur d'un coup, sans les nommer une par une. Il tombe juste
          # ici parce que l'API attend déjà DB_HOST, DB_USER et DB_PASSWORD sous
          # ces noms exacts depuis le Jour 1.
          #
          # Aucune de ces valeurs n'est dans l'image ni dans le dépôt : la même
          # image tourne contre n'importe quelle base sans être reconstruite.
          envFrom:
            - configMapRef:
                name: todo-config
            - secretRef:
                name: todo-secret

          # Ces valeurs ont été trouvées par l'échec, pas devinées.
          #
          # Mesuré avec kubectl top sous une charge d'environ 10 requêtes par
          # seconde : le conteneur occupe 16 à 17 Mi. En resserrant limits.memory
          # cran par cran, 20Mi tient et 18Mi part en OOMKilled avec un
          # Exit Code 137. Le plancher réel est donc entre les deux.
          #
          # 96Mi et non 20Mi, et c'est un choix : le plancher a été mesuré sous
          # une charge légère, avec un seul profil de requêtes. Une pointe de
          # trafic, un corps JSON plus gros ou un ramasse-miettes qui passe au
          # mauvais moment suffiraient à faire tomber un pod calé au ras de sa
          # consommation. La mesure dit où est le mur, elle ne dit pas à quelle
          # distance s'en garer.
          #
          # Aucune limite de CPU, volontairement : une limite CPU ne tue pas le
          # conteneur, elle le ralentit par étranglement, ce qui se diagnostique
          # bien plus mal qu'un OOMKilled. La requête suffit à réserver la place
          # au moment du placement.
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 96Mi

          # Deux sondes, deux décisions différentes.
          #
          # readiness décide QUI REÇOIT LE TRAFIC. Tant qu'elle échoue, le
          # Service retire le pod de ses endpoints, sans le tuer. C'est elle qui
          # permet un rolling update sans perte : un nouveau pod n'encaisse rien
          # tant qu'il n'a pas fini de démarrer.
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            # Court : l'application démarre en moins d'une seconde une fois la
            # base joignable, et on veut la mettre en service au plus tôt.
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          # liveness décide QUI REDÉMARRE. Elle ne retire rien du Service, elle
          # tue le conteneur pour qu'il reparte propre.
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            # Plus large que la readiness, volontairement. Une liveness trop
            # impatiente redémarre un pod qui n'avait besoin que d'un peu de
            # temps, et transforme une lenteur passagère en boucle de
            # redémarrages qui, elle, ne passe pas.
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
