name: Vérifier le runner

# Déclenchement manuel uniquement : ce workflow ne sert qu'à répondre à une
# question, « le job tourne-t-il bien sur ma machine, et voit-il le cluster ? ».
# Le lancer à chaque push n'apprendrait rien de plus.
on:
  workflow_dispatch:

jobs:
  chez-moi:
    name: Ce que voit le runner self-hosted
    runs-on: self-hosted
    steps:
      # shell: bash sur un runner Windows utilise le bash fourni par Git for
      # Windows. Sans cette ligne, les steps `run` partiraient en PowerShell.
      - name: Identité de la machine
        shell: bash
        run: hostname

      # Un runner hébergé par GitHub afficherait « command not found » : il n'a
      # ni kubectl configuré, ni cluster à joindre.
      - name: Le runner voit-il le cluster
        shell: bash
        run: |
          kubectl config current-context
          kubectl get nodes
          kubectl get all -n todo

      # La preuve qui compte : ce runner atteint le cluster sans clé, sans
      # secret, sans tunnel, parce qu'il tourne sur la même machine que lui.
      - name: L'API répond-elle à travers l'Ingress
        shell: bash
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Host: todo.localhost" http://localhost:8080/health)
          echo "/health répond $code"
          [ "$code" = "200" ]

  chez-github:
    name: Ce que voit un runner hébergé, pour comparaison
    runs-on: ubuntu-latest
    steps:
      - name: Identité de la machine
        run: hostname

      - name: Le cluster est-il joignable depuis le cloud
        run: |
          if command -v kubectl > /dev/null; then
            kubectl config current-context 2>&1 || echo "aucun contexte : ce runner ne connaît aucun cluster"
          else
            echo "kubectl absent : ce runner n'a aucun moyen de joindre le cluster"
          fi
