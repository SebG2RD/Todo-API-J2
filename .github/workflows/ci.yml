name: CI

# Toute branche est vérifiée, seul main publie. La distinction se joue plus bas,
# sur le `if:` du job build : rien ne part sur Docker Hub depuis une branche de
# travail, même si ses tests sont verts.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api

jobs:
  test:
    name: Lint et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # npm ci et pas npm install : le verrou fait foi, la CI n'a pas le droit
      # de résoudre une version différente de celle testée en local.
      - name: Installer les dépendances
        run: npm ci

      - name: Linter
        run: npm run lint

      - name: Tests unitaires
        run: npm test

  test-integration:
    name: Tests d'intégration contre un vrai PostgreSQL
    runs-on: ubuntu-latest
    # Un conteneur annexe, lancé à côté du job et détruit avec lui. Même
    # principe qu'un docker-compose, sauf que GitHub le crée et le supprime
    # tout seul. La base repart vide à chaque run : un test qui dépend d'un
    # reste de la veille n'est pas reproductible.
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo_test_user
          POSTGRES_PASSWORD: todo_test_password
        ports:
          - 5432:5432
        # Sans ce contrôle de santé, les tests démarrent parfois pendant que
        # Postgres s'initialise encore, et échouent une fois sur trois sans
        # qu'on comprenne pourquoi.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Le conteneur de service partage le réseau du job : on le joint par
      # localhost, pas par son nom comme dans un docker-compose.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: todo_test
      DB_USER: todo_test_user
      DB_PASSWORD: todo_test_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Le schéma doit exister avant le premier test, sinon l'échec porte sur
      # une table absente et non sur le comportement testé.
      - name: Rejouer la migration
        run: npm run migrate

      - name: Tests d'intégration
        run: npm run test:integration

  build:
    name: Construire et publier l'image
    # Les deux filets doivent tenir avant qu'une image ne soit fabriquée : un
    # test unitaire vert ne dit rien du contrat entre le code et sa vraie base.
    needs: [test, test-integration]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Le tag est le sha du commit, jamais latest : une image ainsi nommée ne
      # sera écrasée par aucun build suivant, et le retour arrière se résume à
      # redéployer un tag qui existe encore.
      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    name: Déployer sur le cluster
    # Rien ne se déploie avant que l'image existe sur le registry.
    needs: [build]
    # Le runner ne bouge pas, la cible si. Hier il ouvrait une connexion SSH vers
    # une machine injoignable autrement ; aujourd'hui le cluster tourne sur cette
    # même machine, celle où l'agent écoute déjà. Il n'a donc besoin ni de clé ni
    # d'un secret supplémentaire : juste de kubectl et du kubeconfig que k3d y a
    # écrit à la création du cluster. Le déploiement devient plus simple qu'hier.
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api
      TAG: ${{ github.sha }}
      NAMESPACE: todo
      # Nommé explicitement : sur une machine qui connaît plusieurs clusters,
      # un kubectl sans contexte déploierait au hasard sur celui du moment.
      KUBE_CONTEXT: k3d-todo-cluster
    steps:
      - uses: actions/checkout@v4

      # Un job qui déploie sur le mauvais cluster est pire qu'un job qui échoue.
      - name: Vérifier le cluster visé
        shell: bash
        run: |
          kubectl config use-context "$KUBE_CONTEXT"
          kubectl get nodes
          kubectl get namespace "$NAMESPACE"

      # On ne touche qu'à l'image. Le reste de l'état voulu, replicas, sondes,
      # ressources, vit dans les manifestes et n'a pas à être réécrit à chaque
      # déploiement.
      - name: Mettre à jour l'image du Deployment
        shell: bash
        run: |
          kubectl set image deployment/todo-api "todo-api=$IMAGE:$TAG" \
            -n "$NAMESPACE" --context "$KUBE_CONTEXT"

      # L'étape qui fait tout l'intérêt du job. `set image` rend la main
      # immédiatement, sans rien garantir : c'est `rollout status` qui attend la
      # convergence réelle, pod par pod, et qui échoue si elle n'arrive pas.
      # Sans lui, un tag inexistant donnerait un job vert et une prod inchangée.
      - name: Attendre la convergence du rollout
        shell: bash
        run: |
          kubectl rollout status deployment/todo-api \
            -n "$NAMESPACE" --context "$KUBE_CONTEXT" --timeout=180s

      # Le rollout convergé prouve que les pods sont prêts au sens du cluster.
      # Cette dernière requête prouve qu'ils rendent le service attendu, base
      # comprise, ce que /health seul ne dirait pas.
      - name: Vérifier que l'API répond à travers l'Ingress
        shell: bash
        run: |
          for essai in $(seq 1 20); do
            reponse=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Host: todo.localhost" http://localhost:8080/api/tasks || echo 000)
            if [ "$reponse" = "200" ]; then
              echo "/api/tasks répond 200 après $essai tentative(s)"
              exit 0
            fi
            echo "tentative $essai : /api/tasks répond $reponse, nouvel essai dans 3 s"
            sleep 3
          done
          echo "::error::/api/tasks n'a jamais répondu 200 : le déploiement est en échec"
          kubectl get pods -n "$NAMESPACE" -o wide
          kubectl logs -n "$NAMESPACE" -l app=todo-api --tail=40 || true
          exit 1

      - name: Version réellement en place
        if: always()
        shell: bash
        run: |
          kubectl get deployment todo-api -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
