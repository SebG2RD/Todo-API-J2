name: CI

# Toute branche est vérifiée, seul main publie. La distinction se joue plus bas,
# sur le `if:` du job build : rien ne part sur Docker Hub depuis une branche de
# travail, même si ses tests sont verts.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api

jobs:
  test:
    name: Lint et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # npm ci et pas npm install : le verrou fait foi, la CI n'a pas le droit
      # de résoudre une version différente de celle testée en local.
      - name: Installer les dépendances
        run: npm ci

      - name: Linter
        run: npm run lint

      - name: Tests unitaires
        run: npm test

  test-integration:
    name: Tests d'intégration contre un vrai PostgreSQL
    runs-on: ubuntu-latest
    # Un conteneur annexe, lancé à côté du job et détruit avec lui. Même
    # principe qu'un docker-compose, sauf que GitHub le crée et le supprime
    # tout seul. La base repart vide à chaque run : un test qui dépend d'un
    # reste de la veille n'est pas reproductible.
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo_test_user
          POSTGRES_PASSWORD: todo_test_password
        ports:
          - 5432:5432
        # Sans ce contrôle de santé, les tests démarrent parfois pendant que
        # Postgres s'initialise encore, et échouent une fois sur trois sans
        # qu'on comprenne pourquoi.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Le conteneur de service partage le réseau du job : on le joint par
      # localhost, pas par son nom comme dans un docker-compose.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: todo_test
      DB_USER: todo_test_user
      DB_PASSWORD: todo_test_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Le schéma doit exister avant le premier test, sinon l'échec porte sur
      # une table absente et non sur le comportement testé.
      - name: Rejouer la migration
        run: npm run migrate

      - name: Tests d'intégration
        run: npm run test:integration

  build:
    name: Construire et publier l'image
    # Les deux filets doivent tenir avant qu'une image ne soit fabriquée : un
    # test unitaire vert ne dit rien du contrat entre le code et sa vraie base.
    needs: [test, test-integration]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Le tag est le sha du commit, jamais latest : une image ainsi nommée ne
      # sera écrasée par aucun build suivant, et le retour arrière se résume à
      # redéployer un tag qui existe encore.
      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déployer sur la machine cible
    # Rien ne se déploie avant que l'image existe sur le registry.
    needs: [build]
    # Le runner hébergé par GitHub ne peut pas joindre une machine posée sur un
    # bureau, derrière une box, sans adresse publique. On place donc
    # l'exécutrice du bon côté de la porte, et ce job seul y tourne : les tests
    # restent sur des machines jetables fournies par GitHub.
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/todo-api
      TAG: ${{ github.sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4

      # La clé privée vit en mémoire, dans un agent, et rien d'autre. Un fichier
      # de clé écrit sur le disque du runner y survivrait au job ; ici, l'agent
      # meurt avec lui. `tr -d` retire les retours chariot que Windows ajoute au
      # passage, et sans lesquels ssh-add refuse la clé comme invalide.
      - name: Charger la clé de déploiement dans un agent SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)" > /dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
          # L'empreinte de la machine cible est relevée à chaud : la maquette
          # est reconstruite souvent, donc sa clé d'hôte change souvent.
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null

      # Le fichier qui décrit la stack part du dépôt vers la machine cible. Le
      # .env, lui, reste là-bas : il porte le mot de passe de la base et n'est
      # jamais poussé, jamais versionné.
      - name: Envoyer la description de la stack
        shell: bash
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /srv/todo"
          # Tout le dossier deploy/ : le compose, la configuration de Prometheus
          # et la définition du tableau de bord. Ces trois-là sont du code, et
          # ils ne se modifient jamais directement sur la machine cible.
          scp -P "$DEPLOY_PORT" -r deploy/. "$DEPLOY_USER@$DEPLOY_HOST:/srv/todo/"
          # env.example n'a rien à faire en production : le vrai .env est déjà
          # là-bas, posé une fois à la main, et il porte le mot de passe.
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "rm -f /srv/todo/env.example"

      # Le sha du commit devient la version déployée. Aucune ambiguïté possible
      # sur ce qui tourne : ce tag ne désigne que ce commit-là.
      - name: Déployer la version du commit
        shell: bash
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /srv/todo && IMAGE='$IMAGE' TAG='$TAG' docker compose up -d --remove-orphans"

      # Sans cette étape, un job vert ne prouverait qu'une chose : que les
      # commandes sont parties. Pas que l'application répond.
      - name: Vérifier que l'API répond
        shell: bash
        run: |
          for essai in $(seq 1 30); do
            reponse=$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/health" || echo 000)
            if [ "$reponse" = "200" ]; then
              echo "/health répond 200 après $essai tentative(s)"
              ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "curl -s http://localhost:3000/health"
              exit 0
            fi
            echo "tentative $essai : /health répond $reponse, nouvel essai dans 2 s"
            sleep 2
          done
          echo "::error::/health n'a jamais répondu 200 : le déploiement est en échec"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker ps -a --filter name=todo- ; docker logs --tail 40 todo-api" || true
          exit 1

      # L'agent meurt avec le job même sans cette ligne, mais un runner
      # self-hosted n'est pas jetable : on ne laisse pas de clé en mémoire
      # derrière soi sur une machine qui, elle, reste allumée.
      - name: Décharger la clé
        if: always()
        shell: bash
        run: ssh-agent -k > /dev/null 2>&1 || true
